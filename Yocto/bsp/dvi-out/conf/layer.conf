#
# meta layer: DVI (HDMI-compatible) output of the RPi Camera FMC Versal designs.
# Added to a target's build by listing "Yocto/bsp/dvi-out" in
# Yocto/bsp/<target>/bblayers-extra.txt (Yocto/scripts/configure-build.sh).
# The target must also add  xlnx_mixer.connect_drm_bridge=1  to
# BSP_EXTRA_BOOTARGS (conf/local.conf.append).

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
	${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "dvi-out"
BBFILE_PATTERN_dvi-out = "^${LAYERDIR}/"
BBFILE_PRIORITY_dvi-out = "8"
LAYERSERIES_COMPAT_dvi-out = "scarthgap"
