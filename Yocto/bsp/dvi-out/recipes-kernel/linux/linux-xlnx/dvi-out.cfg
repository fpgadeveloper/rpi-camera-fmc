# DVI output (Versal): 8T49N241 reference clock driver built in (so the
# transceiver reference clock is up before user space), fixed-mode panel-dpi
# bridge for the xlnx_mixer CRTC, Xilinx AXI IIC for the HDMI control bus.
CONFIG_COMMON_CLK_IDT8T49N24X=y
CONFIG_DRM_PANEL_SIMPLE=y
CONFIG_DRM_PANEL_BRIDGE=y
CONFIG_I2C_XILINX=y
CONFIG_DRM_XLNX_MIXER=y
CONFIG_DRM_XLNX_BRIDGE_VTC=y
