#
# Set the VCK190 FMC VADJ rail to 1.2 V before every boot.
#
# The FMC VADJ rail (shared by FMCP1 and FMCP2) comes from the IR38164 buck
# regulator (U185, I2C addr 0x1E behind mux 0x74 channel 0 on LPD I2C0).
# Normally the system controller sets it, but doing it in u-boot guarantees
# VADJ is up before Linux probes the camera I2C buses, and works when the SC
# is absent or unconfigured.
#
# The RPi Camera FMC needs 1.2 V (MIPI_DPHY + LVCMOS12 in the FMC banks). The
# write sequence is the Opsero "vadj_1v2_en" IR38164 profile (same registers as
# the 1.5 V profile used by the other Opsero VCK190 designs, with every voltage
# word scaled by 1.2/1.5: 0x25 0x80->0x33 (VOUT 0x0180->0x0133, 1/256 V LSB),
# 0x3B and 0x3E 0xF3->0x8F (0x01F3->0x018F)); the enable bit (0x22=0x80) last.
#
# "i2c dev 3": in the EDF u-boot's DM numbering, LPD I2C0 (ff020000) is bus 3.
CONFIG_CMD_I2C=y
CONFIG_BOOTCOMMAND="i2c dev 3; i2c mw 0x74 0x00.0 0x01 0x1; i2c mw 0x1E 0x24.1 0x01 0x1; i2c mw 0x1E 0x25.1 0x33 0x1; i2c mw 0x1E 0x3A.1 0x01 0x1; i2c mw 0x1E 0x3B.1 0x8F 0x1; i2c mw 0x1E 0x3D.1 0x01 0x1; i2c mw 0x1E 0x3E.1 0x8F 0x1; i2c mw 0x1E 0x3F.1 0x00 0x1; i2c mw 0x1E 0x40.1 0x00 0x1; i2c mw 0x1E 0x41.1 0x00 0x1; i2c mw 0x1E 0x42.1 0x00 0x1; i2c mw 0x1E 0x22.1 0x80 0x1; run distro_bootcmd"
